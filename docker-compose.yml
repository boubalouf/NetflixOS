version: '3.8'
services:
  netflixos:
    build: .
    container_name: netflixos
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./media:/media
    restart: always

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/qbit:/config
      - ./media:/media
    ports:
      - "8080:8080"
    restart: always

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./config/jackett:/config
    ports:
      - "9117:9117"
    restart: always

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    volumes:
      - ./config/jellyfin:/config
      - ./media:/media
    ports:
      - "8096:8096"
    restart: always
